{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="section-head anim-entry">
    <span class="section-label-badge">01</span>
    <h1 class="section-caption">Masuk ke Akun</h1>
    <div class="section-divider-line"></div>
</div>

<p class="section-subtext anim-entry delay-1">
    Silakan masukkan username dan password Anda untuk melanjutkan.
</p>

<section class="about-card-box anim-entry delay-1" style="max-width: 460px; margin: 0 auto;">
    <form action="{{ url_for('login') }}" method="POST" class="contact-form-grid">
        <div class="form-field">
            <label for="username" class="field-label">USERNAME</label>
            <input type="text" id="username" name="username" class="input-control" placeholder="Masukkan username"
                required autofocus>
        </div>

        <div class="form-field">
            <label for="password" class="field-label">PASSWORD</label>
            <input type="password" id="password" name="password" class="input-control" placeholder="Masukkan password"
                required>
        </div>

        <div style="margin-top: 8px;">
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
                <span>Masuk</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
            </button>
        </div>
    </form>
</section>

{% endblock %}
