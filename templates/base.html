<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aldoo - {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="site-header">
        <nav class="nav-bar">
            <a href="{{ url_for('index') }}" class="nav-logo">
                <span>Aldoo</span>
                <span class="nav-logo-tag">dev</span>
            </a>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}" {% if aktif=='index' %} class="active" {% endif %}>Home</a>
                </li>
                <li><a href="{{ url_for('about') }}" {% if aktif=='about' %} class="active" {% endif %}>About</a>
                </li>
                <li><a href="{{ url_for('skill') }}" {% if aktif=='skill' %} class="active" {% endif %}>Skills</a>
                </li>
                <li><a href="{{ url_for('project') }}" {% if aktif=='project' %} class="active" {% endif %}>Projects</a>
                </li>
                <li><a href="{{ url_for('blog') }}" {% if aktif=='blog' %} class="active" {% endif %}>Blog</a>
                </li>
                <li><a href="{{ url_for('contact') }}" {% if aktif=='contact' %} class="active" {% endif %}>Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Aldoo. Dibuat untuk Praktikum Pemrograman Web.</p>
    </footer>
</body>

</html>
